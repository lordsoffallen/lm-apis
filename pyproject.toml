[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "lmapis"
description = "Large Model APIs in one place"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "lordsoffallen", email = "email@example.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "openai>=1.58.1",
    "anthropic>=0.36.0,<0.41.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "google-cloud-aiplatform>=1.75.0",
    "mistralai>=1.2.6",
    "fsspec>=2023.1.0",
]
dynamic = ["version"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/lmapis/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/lmapis"]

[dependency-groups]
dev = [
    "dotenv>=0.9.9",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.26.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "coverage>=7.0.0",
    "PyYAML>=6.0.0",
]

[project.urls]
"Homepage" = "https://github.com/lordsoffallen/lm-apis"
"Bug Tracker" = "https://github.com/lordsoffallen/lm-apis/issues"
